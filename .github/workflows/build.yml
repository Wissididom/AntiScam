name: Deno Build

permissions:
  contents: "read"

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: |
          deno install
      - name: Compile (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          deno compile -EN --output AntiScam-${{ matrix.os }}.exe main.ts
      - name: Compile (Ubuntu and Mac)
        if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
        run: |
          deno compile -EN --output AntiScam-${{ matrix.os }} main.ts
      - name: Upload artifact (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AntiScam-${{ matrix.os }}
          path: AntiScam-${{ matrix.os }}.exe
      - name: Upload artifact (Ubuntu and Mac)
        if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AntiScam-${{ matrix.os }}
          path: AntiScam-${{ matrix.os }}
  create-release:
    needs: [build]
    permissions:
      contents: "write"
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout Code
        with:
          fetch-depth: 0 # allows for tags access
          persist-credentials: true # Required to update the nightly-build tag.

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        name: Download artifacts
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: Rename artifacts
        run: |
          mv release-artifacts/AntiScam-windows-latest.exe release-artifacts/AntiScam-Windows.exe
          mv release-artifacts/AntiScam-ubuntu-latest release-artifacts/AntiScam-Linux
          mv release-artifacts/AntiScam-macos-latest release-artifacts/AntiScam-Mac

      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          replacesArtifacts: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "release-artifacts/*"
          body: ${{ github.event.head_commit.message }}
          prerelease: true
          name: Nightly Release
          tag: nightly-build

      - name: Update nightly-build tag
        run: |
          git tag -f nightly-build
          git push -f origin nightly-build
        shell: bash
